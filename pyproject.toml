[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gdb-mcp"
version = "0.1.0"
description = "MCP server that drives GDB through pygdbmi"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "pygdbmi>=0.11.0"]

[project.scripts]
gdb-mcp = "gdb_mcp.server:main"

[tool.setuptools]
packages = ["gdb_mcp"]
